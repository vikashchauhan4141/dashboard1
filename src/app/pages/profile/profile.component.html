<p-toast></p-toast>
<div class="profile-container">
  
  <div class="profile-header">
    <h1 class="page-title"><i class="pi pi-user-edit"></i> Account Settings</h1>
    <span class="role-badge" [ngClass]="userRole">{{ userRole | uppercase }}</span>
  </div>

  <div class="profile-grid">
    
    <!-- Profile Info Card -->
    <div class="profile-card">
      <div class="card-header">
        <h3><i class="pi pi-id-card"></i> Personal Details</h3>
        <p>Keep your account contact information up to date.</p>
      </div>
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="card-body">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" pInputText formControlName="name" class="w-full" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" pInputText formControlName="email" class="w-full" placeholder="john@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" pInputText formControlName="phone" class="w-full" placeholder="e.g. +1 555-0199" />
        </div>
        <div class="form-group" *ngIf="userRole !== 'super_admin'">
          <label class="form-label">Company Name</label>
          <input type="text" pInputText formControlName="company" class="w-full" placeholder="Enter company" />
        </div>
        <div class="form-group" *ngIf="userRole !== 'super_admin'">
          <label class="form-label">Street Address</label>
          <input type="text" pInputText formControlName="street" class="w-full" placeholder="Enter street" />
        </div>
        <div class="card-footer">
          <button pButton type="submit" label="Save Details" icon="pi pi-save" class="p-button-success" [loading]="loadingProfile"></button>
        </div>
      </form>
    </div>

    <!-- Password Change Card -->
    <div class="profile-card">
      <div class="card-header">
        <h3><i class="pi pi-key"></i> Security Settings</h3>
        <p>Update your password regularly to keep your account secure.</p>
      </div>
      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="card-body">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <p-password formControlName="oldPassword" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter current password"></p-password>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <p-password formControlName="newPassword" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="At least 8 characters"></p-password>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <p-password formControlName="confirmPassword" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Re-enter new password"></p-password>
          <small class="text-red-500 block mt-1" *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched">
            Passwords do not match.
          </small>
        </div>
        <div class="card-footer">
          <button pButton type="submit" label="Change Password" icon="pi pi-lock" class="p-button-warning" [loading]="loadingPassword" [disabled]="passwordForm.invalid"></button>
        </div>
      </form>
    </div>

  </div>

</div>
